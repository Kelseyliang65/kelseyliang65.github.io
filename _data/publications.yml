main:
  - title: "Sparse Updates Generalize Better Than Optimization: Stability Analysis for Randomized Subspace Descent"
    collaborators: Yan Sun and Li Shen
    conference: NeurIPS 2026
    notes: Spotlight
    description: Stability-based generalization guarantees for randomized subspace descent, covering gradient, coordinate, block, and subspace updates.

  - title: "Generalization Without Compression Penalty: A Stability Analysis of Error Feedback"
    collaborators: Peng Wang, Yan Sun, Yingqi Liu, and Li Shen
    conference: NeurIPS 2026
    notes: Poster
    description: An on-average stability analysis of error feedback in compressed and distributed learning, connecting EF-SGD with DiLoCo-EF.

  - title: "Stability and Generalization of Push-Sum Based Decentralized Optimization over Directed Graphs"
    collaborators: Yan Sun, Xiaochun Cao, and Li Shen
    conference: Manuscript under review
    description: Uniform-stability and excess-risk guarantees for Push-Sum-based decentralized optimization over directed graphs.
